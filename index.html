<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System & Spaceship Flight Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 15, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(244, 63, 94, 0.4);
            pointer-events: auto;
            max-width: 340px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 8px 0;
            color: #f43f5e;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 0.85rem;
            margin: 0 0 12px 0;
            color: #cbd5e1;
            line-height: 1.4;
        }
        .controls-list {
            font-size: 0.8rem;
            background: rgba(30, 41, 59, 0.7);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .controls-list div {
            margin-bottom: 4px;
        }
        .key {
            background: #475569;
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            border-bottom: 2px solid #1e293b;
        }
        #status-panel {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <h1>Solar System Explorer</h1>
        <p>Pilot your exploration cruiser through a 3D procedural solar system with orbiting planets and an emissive sun.</p>
        <div class="controls-list">
            <div><span class="key">W</span> <span class="key">S</span> : Thrust Forward / Reverse</div>
            <div><span class="key">A</span> <span class="key">D</span> : Steer Left / Right</div>
            <div><span class="key">SPACE</span> / <span class="key">SHIFT</span> : Ascend / Descend</div>
        </div>
        <div id="status-panel">System: Deep Space Orbit Stable</div>
    </div>

    <script>
        // Setup Scene, Camera, and Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Starfield background
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starPositions = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 3000;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 2 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2.5, 3000);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Sun
        const sunGeo = new THREE.SphereGeometry(35, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        // Sun Glow Effect
        const sunGlowGeo = new THREE.SphereGeometry(38, 32, 32);
        const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xff4500, transparent: true, opacity: 0.3 });
        const sunGlow = new THREE.Mesh(sunGlowGeo, sunGlowMat);
        scene.add(sunGlow);

        // Planets Data (distance from sun, radius, speed, color, mesh array)
        const planetsData = [
            { name: "Mercury", distance: 70, radius: 3, speed: 0.02, color: 0x888888 },
            { name: "Venus", distance: 110, radius: 5.5, speed: 0.015, color: 0xe3bb76 },
            { name: "Earth", distance: 160, radius: 6, speed: 0.01, color: 0x2266ff, hasClouds: true },
            { name: "Mars", distance: 220, radius: 4, speed: 0.008, color: 0xc1440e },
            { name: "Jupiter", distance: 320, radius: 14, speed: 0.005, color: 0xd4a373 },
            { name: "Saturn", distance: 430, radius: 10, speed: 0.0035, color: 0xf4e2bb, hasRings: true },
            { name: "Uranus", distance: 540, radius: 7, speed: 0.002, color: 0x73d4d4 },
            { name: "Neptune", distance: 640, radius: 7, speed: 0.0015, color: 0x3b82f6 }
        ];

        const planets = [];

        planetsData.forEach(data => {
            const orbitGroup = new THREE.Group();
            scene.add(orbitGroup);

            const planetGeo = new THREE.SphereGeometry(data.radius, 32, 32);
            const planetMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8 });
            const planetMesh = new THREE.Mesh(planetGeo, planetMat);
            
            planetMesh.position.x = data.distance;
            orbitGroup.add(planetMesh);

            // Saturn Rings
            if (data.hasRings) {
                const ringGeo = new THREE.RingGeometry(data.radius + 3, data.radius + 8, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4a373, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                planetMesh.add(ring);
            }

            planets.push({ group: orbitGroup, mesh: planetMesh, distance: data.distance, speed: data.speed, angle: Math.random() * Math.PI * 2 });
        });

        // Spaceship (Player Cruiser)
        const shipGroup = new THREE.Group();
        const hullGeo = new THREE.ConeGeometry(1.5, 5, 4);
        hullGeo.rotateX(Math.PI / 2);
        const hullMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.9, roughness: 0.2 });
        const hull = new THREE.Mesh(hullGeo, hullMat);
        shipGroup.add(hull);

        // Wings
        const wingGeo = new THREE.BoxGeometry(5, 0.1, 1.5);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8 });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        wings.position.set(0, 0, 0.5);
        shipGroup.add(wings);

        shipGroup.position.set(0, 20, 220);
        scene.add(shipGroup);

        // Ship Flight Physics State
        let shipVelocity = new THREE.Vector3(0, 0, 0);
        let shipRotationY = 0;
        let shipRotationX = 0;

        // Controls
        const keys = { w: false, s: false, a: false, d: false, space: false, shift: false };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
        });

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Rotate Planets around Sun
            planets.forEach(planet => {
                planet.angle += planet.speed * delta;
                planet.group.rotation.y = planet.angle;
                planet.mesh.rotation.y += 0.5 * delta;
            });

            // Spaceship Controls & Flight
            const turnSpeed = 1.5 * delta;
            if (keys.a) shipRotationY += turnSpeed;
            if (keys.d) shipRotationY -= turnSpeed;

            shipGroup.rotation.y = shipRotationY;

            const forwardDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), shipRotationY);
            
            const acceleration = 40 * delta;
            if (keys.w) shipGroup.position.addScaledVector(forwardDir, acceleration);
            if (keys.s) shipGroup.position.addScaledVector(forwardDir, -acceleration);
            if (keys.space) shipGroup.position.y += 20 * delta;
            if (keys.shift) shipGroup.position.y -= 20 * delta;

            // Smooth Camera Follow behind Spaceship
            const camOffset = new THREE.Vector3(0, 5, 15).applyAxisAngle(new THREE.Vector3(0, 1, 0), shipRotationY);
            const targetCamPos = shipGroup.position.clone().add(camOffset);
            camera.position.lerp(targetCamPos, 0.1);
            
            const lookTarget = shipGroup.position.clone().add(new THREE.Vector3(0, 1, 0));
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
