<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D WebGL Data Center & Drone Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            pointer-events: auto;
            max-width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 10px 0;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 0.85rem;
            margin: 0 0 12px 0;
            color: #94a3b8;
            line-height: 1.4;
        }
        .controls-list {
            font-size: 0.8rem;
            background: rgba(30, 41, 59, 0.6);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .controls-list div {
            margin-bottom: 4px;
        }
        .key {
            background: #334155;
            color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            border-bottom: 2px solid #1e293b;
        }
        #status-panel {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #4ade80;
            font-weight: bold;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <h1>Data Center 3D Sim</h1>
        <p>Explore the server racks and pilot your inspection drone through the autonomous data facility.</p>
        <div class="controls-list">
            <div><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> : Move Drone</div>
            <div><span class="key">SPACE</span> / <span class="key">SHIFT</span> : Elevate / Lower</div>
            <div><span class="key">MOUSE</span> : Rotate Camera view</div>
        </div>
        <div id="status-panel">Status: All Systems Operational (100%)</div>
    </div>

    <script>
        // Setup Scene, Camera, and Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050814);
        scene.fog = new THREE.FogExp2(0x050814, 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x1e293b, 1.2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
        directionalLight.position.set(20, 40, 20);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Floor
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x0f172a, 
            roughness: 0.4,
            metalness: 0.8
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid helper on floor
        const gridHelper = new THREE.GridHelper(100, 50, 0x38bdf8, 0x1e293b);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Create Server Racks
        const rackGeo = new THREE.BoxGeometry(2, 6, 1);
        const rackMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.7 });
        
        const serverRacks = [];
        for (let x = -15; x <= 15; x += 6) {
            for (let z = -20; z <= 20; z += 5) {
                if (Math.abs(x) < 2) continue; // Leave central aisle clear
                
                const rackGroup = new THREE.Group();
                const rack = new THREE.Mesh(rackGeo, rackMat);
                rack.position.y = 3;
                rack.castShadow = true;
                rack.receiveShadow = true;
                rackGroup.add(rack);

                // Server blinking LED lights
                for (let y = 0.5; y < 5.5; y += 0.8) {
                    const ledGeo = new THREE.BoxGeometry(1.6, 0.1, 1.05);
                    const isGreen = Math.random() > 0.15;
                    const ledMat = new THREE.MeshBasicMaterial({ 
                        color: isGreen ? 0x22c55e : 0xef4444 
                    });
                    const led = new THREE.Mesh(ledGeo, ledMat);
                    led.position.set(0, y - 3, 0);
                    rackGroup.add(led);
                }

                rackGroup.position.set(x, 0, z);
                scene.add(rackGroup);
                serverRacks.push(rackGroup);
            }
        }

        // Ceiling lights / neon strips
        for (let z = -20; z <= 20; z += 10) {
            const lightGeo = new THREE.BoxGeometry(10, 0.1, 0.5);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
            const strip = new THREE.Mesh(lightGeo, lightMat);
            strip.position.set(0, 9.9, z);
            scene.add(strip);

            const pointLight = new THREE.PointLight(0x38bdf8, 0.8, 15);
            pointLight.position.set(0, 9.5, z);
            scene.add(pointLight);
        }

        // Drone (Player object)
        const droneGroup = new THREE.Group();
        const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.9, roughness: 0.1 });
        const droneBody = new THREE.Mesh(bodyGeo, bodyMat);
        droneBody.castShadow = true;
        droneGroup.add(droneBody);

        // Drone blades
        const bladeGeo = new THREE.BoxGeometry(1.2, 0.05, 0.2);
        const bladeMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
        for (let i = 0; i < 4; i++) {
            const angle = (i * Math.PI) / 2;
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.set(Math.cos(angle) * 0.8, 0.2, Math.sin(angle) * 0.8);
            droneGroup.add(blade);
        }

        droneGroup.position.set(0, 3, 10);
        scene.add(droneGroup);

        // Controls State
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
        });

        // Mouse look
        let mouseX = 0, mouseY = 0;
        let cameraAngleX = 0, cameraAngleY = 0;
        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body || e.buttons === 1) {
                mouseX = e.movementX || e.clientX - window.innerWidth / 2;
                mouseY = e.movementY || e.clientY - window.innerHeight / 2;
                cameraAngleY -= mouseX * 0.003;
                cameraAngleX -= mouseY * 0.003;
                cameraAngleX = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraAngleX));
            }
        });

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const speed = 8 * delta;

            // Drone movement
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleY);
            const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleY);

            if (keys.w) droneGroup.position.addScaledVector(forward, speed);
            if (keys.s) droneGroup.position.addScaledVector(forward, -speed);
            if (keys.a) droneGroup.position.addScaledVector(side, -speed);
            if (keys.d) droneGroup.position.addScaledVector(side, speed);
            if (keys.space) droneGroup.position.y += speed;
            if (keys.shift) droneGroup.position.y = Math.max(1, droneGroup.position.y - speed);

            // Boundaries
            droneGroup.position.x = Math.max(-18, Math.min(18, droneGroup.position.x));
            droneGroup.position.z = Math.max(-24, Math.min(24, droneGroup.position.z));
            droneGroup.position.y = Math.max(1, Math.min(8, droneGroup.position.y));

            // Camera follow
            const cameraOffset = new THREE.Vector3(0, 2.5, 6).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraAngleY);
            camera.position.copy(droneGroup.position).add(cameraOffset);
            camera.lookAt(droneGroup.position.clone().add(new THREE.Vector3(0, 0.5, 0)));

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
