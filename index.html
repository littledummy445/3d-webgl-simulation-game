<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System & Spaceship Flight Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000000;
            color: #ffffff;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: pointer;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 15, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(244, 63, 94, 0.4);
            pointer-events: auto;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 8px 0;
            color: #f43f5e;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 0.82rem;
            margin: 0 0 12px 0;
            color: #cbd5e1;
            line-height: 1.4;
        }
        .controls-list {
            font-size: 0.78rem;
            background: rgba(30, 41, 59, 0.7);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .controls-list div {
            margin-bottom: 4px;
        }
        .key {
            background: #475569;
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            border-bottom: 2px solid #1e293b;
        }
        #status-panel {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #38bdf8;
            font-weight: bold;
        }
        .control-group {
            margin-top: 10px;
            font-size: 0.8rem;
        }
        .control-group label {
            display: block;
            margin-bottom: 4px;
            color: #f43f5e;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .action-btn {
            flex: 1;
            background: #f43f5e;
            color: white;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.75rem;
        }
        .action-btn:hover {
            background: #e11d48;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <h1>Advanced Solar System</h1>
        <p>Explore with Asteroid Belts, Comet Comets, Comets, Moons, Pointer Lock Flight, and Audio SFX!</p>
        <div class="controls-list">
            <div><span class="key">W</span> <span class="key">S</span> : Thrust Forward / Reverse</div>
            <div><span class="key">MOUSE</span> : Pointer Lock Flight Steering</div>
            <div><span class="key">C</span> : Toggle Camera (Chase / Cockpit)</div>
            <div><span class="key">SPACE</span> / <span class="key">SHIFT</span> : Ascend / Descend</div>
        </div>
        <div class="control-group">
            <label for="timeSpeed">Time Multiplier: <span id="speedValue">1.0</span>x</label>
            <input type="range" id="timeSpeed" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
        <div class="btn-row">
            <button id="lock-btn" class="action-btn">Mouse Look</button>
            <button id="fullscreen-btn" class="action-btn">Fullscreen</button>
        </div>
        <div id="status-panel">System: Click canvas for Mouse Lock Flight</div>
    </div>

    <script>
        // Setup Scene, Camera, and Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Audio Context (Web Audio API)
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(250, audioCtx.currentTime);

            engineGain = audioCtx.createGain();
            engineGain.gain.setValueAtTime(0.0, audioCtx.currentTime);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }

        // Pointer Lock & Mouse Look State
        let isPointerLocked = false;
        let shipPitch = 0;
        let shipYaw = 0;
        let cameraMode = 'chase'; // 'chase' or 'cockpit'

        container.addEventListener('click', () => {
            initAudio();
            if (!isPointerLocked) container.requestPointerLock();
        });

        document.getElementById('lock-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            container.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = (document.pointerLockElement === container);
            document.getElementById('status-panel').innerText = isPointerLocked ? 
                "System: Mouse Locked (Flight Active)" : "System: Click canvas to engage Flight Control";
        });

        document.addEventListener('mousemove', (e) => {
            if (!isPointerLocked) return;
            const sensitivity = 0.003;
            shipYaw -= e.movementX * sensitivity;
            shipPitch -= e.movementY * sensitivity;
            shipPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, shipPitch));
        });

        // Fullscreen toggle
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // Time multiplier
        let timeMultiplier = 1.0;
        document.getElementById('timeSpeed').addEventListener('input', (e) => {
            timeMultiplier = parseFloat(e.target.value);
            document.getElementById('speedValue').innerText = timeMultiplier.toFixed(1);
        });

        // Camera mode toggle 'C'
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyC') {
                cameraMode = (cameraMode === 'chase') ? 'cockpit' : 'chase';
            }
        });

        // Starfield background
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPositions = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 4000;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 2.5 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 3.0, 4000);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Sun & Corona
        const sunGeo = new THREE.SphereGeometry(40, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        const sunGlowGeo = new THREE.SphereGeometry(45, 32, 32);
        const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xff4500, transparent: true, opacity: 0.35 });
        const sunGlow = new THREE.Mesh(sunGlowGeo, sunGlowMat);
        scene.add(sunGlow);

        // Asteroid Belt between Mars (220) and Jupiter (320)
        const asteroidCount = 600;
        const asteroidGeo = new THREE.BufferGeometry();
        const asteroidPositions = new Float32Array(asteroidCount * 3);
        const asteroidRadii = [];

        for (let i = 0; i < asteroidCount; i++) {
            const radius = 260 + (Math.random() - 0.5) * 30;
            const angle = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 10;
            
            asteroidPositions[i * 3] = Math.cos(angle) * radius;
            asteroidPositions[i * 3 + 1] = y;
            asteroidPositions[i * 3 + 2] = Math.sin(angle) * radius;
            
            asteroidRadii.push({ radius, angle, speed: 0.003 + Math.random() * 0.002, y });
        }
        asteroidGeo.setAttribute('position', new THREE.BufferAttribute(asteroidPositions, 3));
        const asteroidMat = new THREE.PointsMaterial({ color: 0x888888, size: 1.8 });
        const asteroidBelt = new THREE.Points(asteroidGeo, asteroidMat);
        scene.add(asteroidBelt);

        // Comet
        const cometGeo = new THREE.SphereGeometry(1.5, 16, 16);
        const cometMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const comet = new THREE.Mesh(cometGeo, cometMat);
        scene.add(comet);
        let cometAngle = 0;

        // Planets Data with Moons
        const planetsData = [
            { name: "Mercury", distance: 70, radius: 3, speed: 0.02, color: 0x888888, moons: 0 },
            { name: "Venus", distance: 110, radius: 5.5, speed: 0.015, color: 0xe3bb76, moons: 0 },
            { name: "Earth", distance: 160, radius: 6, speed: 0.01, color: 0x2266ff, moons: 1, moonDist: 10, moonRadius: 1.2, moonSpeed: 0.05 },
            { name: "Mars", distance: 220, radius: 4, speed: 0.008, color: 0xc1440e, moons: 2, moonDist: 7, moonRadius: 0.8, moonSpeed: 0.07 },
            { name: "Jupiter", distance: 320, radius: 14, speed: 0.005, color: 0xd4a373, moons: 2, moonDist: 22, moonRadius: 2.0, moonSpeed: 0.04 },
            { name: "Saturn", distance: 430, radius: 10, speed: 0.0035, color: 0xf4e2bb, hasRings: true, moons: 1, moonDist: 18, moonRadius: 1.5, moonSpeed: 0.03 },
            { name: "Uranus", distance: 540, radius: 7, speed: 0.002, color: 0x73d4d4, moons: 1, moonDist: 12, moonRadius: 1.0, moonSpeed: 0.045 },
            { name: "Neptune", distance: 640, radius: 7, speed: 0.0015, color: 0x3b82f6, moons: 1, moonDist: 13, moonRadius: 1.1, moonSpeed: 0.035 }
        ];

        const planets = [];

        planetsData.forEach(data => {
            const orbitGroup = new THREE.Group();
            scene.add(orbitGroup);

            const planetGeo = new THREE.SphereGeometry(data.radius, 32, 32);
            const planetMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.8 });
            const planetMesh = new THREE.Mesh(planetGeo, planetMat);
            
            planetMesh.position.x = data.distance;
            orbitGroup.add(planetMesh);

            if (data.hasRings) {
                const ringGeo = new THREE.RingGeometry(data.radius + 3, data.radius + 9, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4a373, side: THREE.DoubleSide, transparent: true, opacity: 0.75 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                planetMesh.add(ring);
            }

            const moonsArr = [];
            if (data.moons > 0) {
                for (let m = 0; m < data.moons; m++) {
                    const moonOrbit = new THREE.Group();
                    planetMesh.add(moonOrbit);

                    const moonGeo = new THREE.SphereGeometry(data.moonRadius, 16, 16);
                    const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.9 });
                    const moonMesh = new THREE.Mesh(moonGeo, moonMat);
                    
                    const distOffset = data.moonDist + (m * 4);
                    moonMesh.position.x = distOffset;
                    moonOrbit.add(moonMesh);

                    moonsArr.push({ group: moonOrbit, speed: data.moonSpeed * (m + 1), angle: Math.random() * Math.PI * 2 });
                }
            }

            planets.push({ group: orbitGroup, mesh: planetMesh, distance: data.distance, speed: data.speed, angle: Math.random() * Math.PI * 2, moons: moonsArr });
        });

        // Spaceship (Player Cruiser)
        const shipGroup = new THREE.Group();
        const hullGeo = new THREE.ConeGeometry(1.5, 5, 4);
        hullGeo.rotateX(Math.PI / 2);
        const hullMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.9, roughness: 0.2 });
        const hull = new THREE.Mesh(hullGeo, hullMat);
        shipGroup.add(hull);

        const wingGeo = new THREE.BoxGeometry(5, 0.1, 1.5);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8 });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        wings.position.set(0, 0, 0.5);
        shipGroup.add(wings);

        shipGroup.position.set(0, 25, 240);
        scene.add(shipGroup);

        // Keyboard Controls
        const keys = { w: false, s: false, a: false, d: false, space: false, shift: false };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'Space') keys.space = true;
            if (e.code === 'ShiftLeft') keys.shift = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'Space') keys.space = false;
            if (e.code === 'ShiftLeft') keys.shift = false;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const effectiveDelta = delta * timeMultiplier;

            // Rotate Planets & Moons
            planets.forEach(planet => {
                planet.angle += planet.speed * effectiveDelta;
                planet.group.rotation.y = planet.angle;
                planet.mesh.rotation.y += 0.5 * effectiveDelta;

                if (planet.moons && planet.moons.length > 0) {
                    planet.moons.forEach(moon => {
                        moon.angle += moon.speed * effectiveDelta;
                        moon.group.rotation.y = moon.angle;
                    });
                }
            });

            // Rotate Asteroid Belt
            const positions = asteroidBelt.geometry.attributes.position.array;
            for (let i = 0; i < asteroidCount; i++) {
                const data = asteroidRadii[i];
                data.angle += data.speed * effectiveDelta;
                positions[i * 3] = Math.cos(data.angle) * data.radius;
                positions[i * 3 + 2] = Math.sin(data.angle) * data.radius;
            }
            asteroidBelt.geometry.attributes.position.needsUpdate = true;

            // Orbit Comet
            cometAngle += 0.4 * effectiveDelta;
            const cometDist = 500;
            comet.position.set(Math.cos(cometAngle) * cometDist, 30, Math.sin(cometAngle) * cometDist * 0.5);

            // Flight physics
            shipGroup.rotation.order = 'YXZ';
            shipGroup.rotation.y = shipYaw;
            shipGroup.rotation.x = shipPitch;

            const forwardDir = new THREE.Vector3(0, 0, -1).applyQuaternion(shipGroup.quaternion);
            
            const acceleration = 55 * delta;
            let isThrusting = false;
            if (keys.w) { shipGroup.position.addScaledVector(forwardDir, acceleration); isThrusting = true; }
            if (keys.s) { shipGroup.position.addScaledVector(forwardDir, -acceleration); isThrusting = true; }
            if (keys.space) shipGroup.position.y += 28 * delta;
            if (keys.shift) shipGroup.position.y -= 28 * delta;

            if (engineGain) {
                engineGain.gain.setTargetAtTime(isThrusting ? 0.3 : 0.02, audioCtx.currentTime, 0.1);
            }

            // Camera follow
            if (cameraMode === 'chase') {
                const camOffset = new THREE.Vector3(0, 5, 18).applyQuaternion(shipGroup.quaternion);
                const targetCamPos = shipGroup.position.clone().add(camOffset);
                camera.position.lerp(targetCamPos, 0.15);
                camera.quaternion.slerp(shipGroup.quaternion, 0.15);
            } else {
                camera.position.copy(shipGroup.position).add(new THREE.Vector3(0, 0.8, -0.5));
                camera.quaternion.slerp(shipGroup.quaternion, 0.2);
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
